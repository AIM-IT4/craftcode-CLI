name: Sync npm runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-npm.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download published Craft Code runtime
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack craftcode-codecraft@0.9.0 --silent | tail -n 1)"
          rm -rf .npm-sync
          mkdir -p .npm-sync
          tar -xzf "$TARBALL" -C .npm-sync
          rm -rf src
          cp -R .npm-sync/package/src ./src
          rm -rf .npm-sync "$TARBALL"

      - name: Commit exact npm runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Runtime already matches npm 0.9.0"
            exit 0
          fi
          git commit -m "chore: sync runtime from npm 0.9.0"
          git push
