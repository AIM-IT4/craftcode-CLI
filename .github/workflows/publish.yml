name: Publish npm

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: publish npm')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use current npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Verify package
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --access public --provenance
