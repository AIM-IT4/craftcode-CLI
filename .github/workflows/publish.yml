name: Publish npm

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-v2
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 10
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: publish npm') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use current npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Verify package
        run: npm pack --dry-run

      - name: Check repository npm credential
        shell: bash
        env:
          NPM_TOKEN: "${{ secrets.NPM_TOKEN }}"
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Repository NPM_TOKEN is configured."
          else
            echo "Repository NPM_TOKEN is not configured; npm will try trusted publishing (OIDC)."
          fi

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"
        run: npm publish --access public --provenance
